# ──────────────────────────────────────────────────────────────────────────────
# MealBot 애플리케이션 설정 파일
# 민감 정보(비밀번호, API 키 등)는 application-secret.properties에서 관리
# ──────────────────────────────────────────────────────────────────────────────

spring.config.import=application-secret.properties

# 애플리케이션 이름 (현재 미사용, 필요 시 주석 해제)
#spring.application.name=MealBot

# 서버 포트 (기본값 8080, 변경 시 주석 해제)
#server.port=8080

# 에러 응답에 message 필드를 포함 (기본값은 감춤)
# → 개발 중 에러 내용을 클라이언트가 볼 수 있도록 설정
spring.web.error.include-message=always

# ── 데이터베이스 (MySQL) ───────────────────────────────────────────────────────
# JDBC URL 설명:
#   - jdbc:mysql://localhost:3306/mealbot_db : 로컬 MySQL의 mealbot_db 스키마에 연결
#   - useSSL=false                           : SSL 연결 비활성화 (로컬 개발용)
#   - allowPublicKeyRetrieval=true           : MySQL 8.x에서 공개키 조회 허용 (인증 방식 관련)
#   - serverTimezone=Asia/Seoul              : 서버 시간대를 한국 표준시(KST)로 설정
#   - characterEncoding=UTF-8               : 한글 등 다국어 문자 인코딩
spring.datasource.url=jdbc:mysql://localhost:3306/mealbot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# username / password → application-secret.properties

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# ddl-auto 옵션:
#   - create      : 앱 시작 시 테이블 새로 생성 (기존 데이터 삭제됨)
#   - update      : 엔티티 변경 사항을 테이블에 자동 반영 (데이터 유지) ← 현재 설정
#   - validate    : 엔티티와 테이블 구조가 일치하는지 검증만 함
#   - none        : 아무것도 하지 않음 (프로덕션 권장)
spring.jpa.hibernate.ddl-auto=update

# 실행되는 SQL 쿼리를 콘솔에 출력 (디버깅용, 프로덕션에서는 false로 변경)
spring.jpa.show-sql=true
spring.jpa.database=mysql

# ── Google OAuth2 소셜 로그인 ──────────────────────────────────────────────────
# Google Cloud Console에서 발급받은 OAuth2 클라이언트 자격증명.
# 주의: 이 값들은 외부에 노출되면 안 됨.
#       프로덕션에서는 환경변수 또는 보안 저장소를 사용할 것.

# client-id / client-secret → application-secret.properties

# 요청할 Google 계정 정보 범위:
#   - profile : 이름, 프로필 사진
#   - email   : 이메일 주소
spring.security.oauth2.client.registration.google.scope=profile,email

# OAuth2 인증 완료 후 Google이 콜백할 URL.
# Google Cloud Console의 "승인된 리디렉션 URI"에 동일하게 등록되어 있어야 함.
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ── JWT (JSON Web Token) ──────────────────────────────────────────────────────
# jwt.secret → application-secret.properties

# JWT 토큰 유효 기간 (밀리초 단위)
# 86400000ms = 60 * 60 * 24 * 1000 = 24시간
jwt.expiration-ms=86400000