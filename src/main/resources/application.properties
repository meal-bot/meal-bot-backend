# ──────────────────────────────────────────────────────────────────────────────
# MealBot 애플리케이션 설정 파일
# 민감 정보(비밀번호, API 키 등)는 application-secret.properties에서 관리
# 환경별 설정은 application-{profile}.properties에서 덮어씀
# ──────────────────────────────────────────────────────────────────────────────

spring.config.import=application-secret.properties

spring.web.error.include-message=always

# ── 서버 ──────────────────────────────────────────────────────────────────────
# 리버스 프록시(ngrok, Nginx 등) 뒤에서도 redirect-uri가 올바르게 생성되도록
server.forward-headers-strategy=FRAMEWORK

# ── 데이터베이스 (MySQL) ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/mealbot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database=mysql

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
# client-id, client-secret은 application-secret.properties에서 관리
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.backend-url}/login/oauth2/code/google

# ── Kakao OAuth2 ──────────────────────────────────────────────────────────────
# Google과 달리 카카오는 provider 정보를 직접 명시해야 함 (Spring 기본 제공 아님)
# client-id, client-secret은 application-secret.properties에서 관리
spring.security.oauth2.client.registration.kakao.redirect-uri=${app.backend-url}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,profile_image
# 카카오는 client_secret을 POST body로 전달해야 함 (Google은 Basic 방식)
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

# 카카오 provider 엔드포인트 직접 명시 (Google은 Spring이 자동 처리)
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
# 카카오 응답의 최상위 식별자는 숫자 id (Google은 sub)
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ── 환경별 URL (기본값은 로컬, 프로파일에서 덮어씀) ───────────────────────────
app.frontend-url=http://localhost:5173
app.backend-url=http://localhost:8080

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.expiration-ms=86400000

# ── AI 서버 ───────────────────────────────────────────────────────────────────
ai.server.url=http://localhost:8000
ai.recommendation.limit=5
ai.recommendation.mode=v4-lite