# ──────────────────────────────────────────────────────────────────────────────
# MealBot 애플리케이션 설정 파일
# 민감 정보(비밀번호, API 키 등)는 application-secret.properties에서 관리
# 환경별 설정은 application-{profile}.properties에서 덮어씀
# ──────────────────────────────────────────────────────────────────────────────

spring.config.import=application-secret.properties

spring.web.error.include-message=always

# ── 서버 ──────────────────────────────────────────────────────────────────────
# 리버스 프록시(ngrok, Nginx 등) 뒤에서도 redirect-uri가 올바르게 생성되도록
server.forward-headers-strategy=FRAMEWORK

# ── 데이터베이스 (MySQL) ───────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/mealbot_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database=mysql

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${app.backend-url}/login/oauth2/code/google

# ── 환경별 URL (기본값은 로컬, 프로파일에서 덮어씀) ───────────────────────────
app.frontend-url=http://localhost:5173
app.backend-url=http://localhost:8080

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.expiration-ms=86400000

# ── AI 서버 ───────────────────────────────────────────────────────────────────
ai.server.url=http://localhost:8000
ai.recommendation.limit=5
ai.recommendation.mode=v4-lite