# ── AWS 개발 서버 환경 ─────────────────────────────────────────────────────────
# 실행: java -jar mealbot.jar --spring.profiles.active=aws
#
# ★ 실행 전 확인 ★
#   1. ai.server.url → 파트너 URL로 교체
#   2. Google Cloud Console → 승인된 리디렉션 URI에 아래 URL 등록
#      https://api.mealbot.site/login/oauth2/code/google
#   3. 카카오 개발자 콘솔 → Redirect URI에 아래 URL 등록
#      https://api.mealbot.site/login/oauth2/code/kakao

#443 = HTTPS 기본 포트 EC2서버
server.port=443
server.ssl.certificate=/etc/letsencrypt/live/mealbot.site/fullchain.pem
server.ssl.certificate-private-key=/etc/letsencrypt/live/mealbot.site/privkey.pem

app.frontend-url=https://mealbot.site
app.backend-url=https://api.mealbot.site
# 파이썬 파트 서버주소 바뀌면 변경
ai.server.url=http://210.104.76.139:8000

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
# [codex] 로컬 개발 환경이 아닌 경우 게스트 채팅 쿠키는 HTTPS로만 전송한다.
app.guest-chat.cookie-secure=true
