# ── 운영 환경 (KT Cloud) ─────────────────────────────────────────────────────
# 실행: java -jar mealbot.jar --spring.profiles.active=prod
#
# ★ 실행 전 확인 ★
#   1. app.backend-url → KT Cloud 서버 실제 IP/도메인으로 교체
#   2. ai.server.url   → AI 서버 실제 주소로 교체
#   3. Google Cloud Console → 승인된 리디렉션 URI에 아래 URL 등록
#      {app.backend-url}/login/oauth2/code/google

app.frontend-url=https://meal-bot-frontend.vercel.app
app.backend-url=https://
ai.server.url=https://

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none