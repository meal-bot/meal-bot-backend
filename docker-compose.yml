services:
  mysql:
    image: mysql:8.0
    container_name: mealbot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: mealbot_db
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - mealbot-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mealbot-mysql-data: